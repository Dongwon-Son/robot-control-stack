[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "rcs_tam"
version = "0.7.2"
description = "TAM (Torque Adaptation Module) for robot-control-stack: single-process deployment (JAX history encoder + hw.Franka TamHook)"
readme = "README.md"
license = "AGPL-3.0-or-later"
# The robot side additionally needs rcs-core and rcs_panda / rcs_fr3 built from
# this fork; they are imported lazily so the inference code stays usable alone.
dependencies = [
  "numpy",
  "jax",
  "flax",
  "einops",
  "tqdm",
  "mujoco",
  "mujoco-mjx",
]
authors = [{ name = "Dongwon Son" }]
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rcs_tam.assets" = ["franka_panda/*.xml", "franka_panda/assets/*", "checkpoints/**"]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.isort]
profile = "black"
